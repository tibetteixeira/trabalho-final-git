services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${SENHA_BANCO:-app}
    volumes:
      - dados-banco:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U app -d app"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build:
      context: .
      target: producao
    environment:
      URL_BANCO: postgresql://app:${SENHA_BANCO:-app}@db:5432/app
      ADMIN_USUARIO: ${ADMIN_USUARIO:-admin}
      ADMIN_NOME: ${ADMIN_NOME:-Administrador}
      ADMIN_SENHA: ${ADMIN_SENHA:-admin123}
      CHAVE_SECRETA: ${CHAVE_SECRETA:-troque-esta-chave-em-producao}
      FUSO_HORARIO: ${FUSO_HORARIO:-America/Fortaleza}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Teste por TCP: a porta só abre após inicializar o banco, e não gera log a cada verificação.
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 2)"]
      interval: 2s
      timeout: 3s
      retries: 15

  web:
    image: nginx:1.27-alpine
    ports:
      - "${PORTA_WEB:-8080}:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy

  cli:
    build:
      context: .
      target: producao
    profiles: ["cli"]
    entrypoint: ["python", "cli.py"]
    command: ["--help"]
    environment:
      URL_API: http://api:8000
      # Repassa o token do host (export TOKEN_CLI=...) sem gravá-lo em arquivo.
      TOKEN_CLI: ${TOKEN_CLI:-}
    depends_on:
      api:
        condition: service_healthy

  db-testes:
    image: postgres:16-alpine
    profiles: ["testes"]
    environment:
      POSTGRES_DB: app_test
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U app -d app_test"]
      interval: 2s
      timeout: 3s
      retries: 15

  testes:
    build:
      context: .
      target: testes
    profiles: ["testes"]
    environment:
      URL_BANCO: postgresql://app:app@db-testes:5432/app_test
      CHAVE_SECRETA: chave-de-teste
    command: >
      pytest -q --cov=api --cov=db --cov=cli --cov-report=term-missing --cov-fail-under=100
    depends_on:
      db-testes:
        condition: service_healthy

volumes:
  dados-banco:
