<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vendas</title>
  <style>
    :root {
      --fundo: #f4f5f7;
      --superficie: #ffffff;
      --texto: #1f2933;
      --suave: #616e7c;
      --primaria: #2563eb;
      --primaria-escura: #1d4ed8;
      --perigo: #b91c1c;
      --sucesso: #15803d;
      --borda: #d9dde3;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--fundo);
      color: var(--texto);
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1.5rem;
      background: var(--superficie);
      border-bottom: 1px solid var(--borda);
    }
    header h1 { font-size: 1.1rem; margin: 0; }
    main { max-width: 960px; margin: 2rem auto; padding: 0 1rem; }
    .cartao {
      background: var(--superficie);
      border: 1px solid var(--borda);
      border-radius: 8px;
      padding: 1.5rem;
    }
    #tela-login .cartao { max-width: 360px; margin: 4rem auto; }
    label { display: block; font-size: 0.9rem; margin: 0.75rem 0 0.25rem; }
    input, select {
      width: 100%;
      padding: 0.55rem 0.65rem;
      border: 1px solid var(--borda);
      border-radius: 6px;
      font-size: 1rem;
      background: var(--superficie);
      color: var(--texto);
    }
    button {
      cursor: pointer;
      border: 0;
      border-radius: 6px;
      padding: 0.55rem 1rem;
      font-size: 0.95rem;
      background: var(--primaria);
      color: #fff;
    }
    button:hover { background: var(--primaria-escura); }
    button.secundario { background: transparent; color: var(--primaria); border: 1px solid var(--primaria); }
    #formulario-login button { width: 100%; margin-top: 1.25rem; }
    .erro { color: var(--perigo); font-size: 0.9rem; min-height: 1.2em; margin-top: 0.75rem; }
    .situacao { font-size: 0.85rem; color: var(--suave); }
    .situacao .ponto { display: inline-block; width: 0.6rem; height: 0.6rem; border-radius: 50%; background: var(--suave); margin-right: 0.35rem; }
    .situacao.disponivel .ponto { background: var(--sucesso); }
    .situacao.indisponivel .ponto { background: var(--perigo); }
    .oculto { display: none !important; }
    /* Esconde só visualmente: o texto continua disponível para leitores de tela. */
    .visualmente-oculto {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }
    .cartao + .cartao { margin-top: 1.5rem; }
    .cabecalho-cartao { display: flex; flex-wrap: wrap; gap: 1rem; align-items: flex-end; justify-content: space-between; }
    .cabecalho-cartao h2 { margin: 0; }
    .acoes-cabecalho { display: flex; flex-wrap: wrap; gap: 0.75rem; }
    /* Dashboard (#6): gráficos em HTML/CSS, sem biblioteca externa. */
    .acoes-cabecalho.alinhadas { align-items: center; }
    .resumo-dashboard { display: flex; flex-wrap: wrap; gap: 2rem; margin: 1rem 0 0.5rem; }
    .resumo-dashboard div { display: flex; flex-direction: column; }
    .resumo-dashboard span { font-size: 0.85rem; color: var(--suave); }
    .resumo-dashboard strong { font-size: 1.4rem; }
    .graficos { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 1.5rem; margin-top: 1rem; }
    .grafico { margin: 0; padding: 1rem; border: 1px solid var(--borda); border-radius: 6px; min-width: 0; }
    .grafico figcaption { font-weight: 600; margin-bottom: 0.15rem; }
    .grafico .legenda { font-size: 0.8rem; color: var(--suave); margin: 0 0 0.75rem; }
    .grafico .vazio { color: var(--suave); font-size: 0.9rem; padding: 1.5rem 0; text-align: center; }
    .colunas { display: flex; align-items: flex-end; gap: 0.4rem; height: 190px; }
    .coluna { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; }
    .coluna .valor { font-size: 0.7rem; color: var(--suave); white-space: nowrap; margin-bottom: 0.2rem; }
    /* A barra tem uma área só dela: a altura em % é sempre proporcional ao maior valor. */
    .coluna .area-barra { flex: 1; min-height: 0; width: 100%; display: flex; align-items: flex-end; justify-content: center; }
    .coluna .barra { width: 100%; max-width: 3rem; background: var(--primaria); border-radius: 3px 3px 0 0; }
    .coluna .rotulo { font-size: 0.75rem; color: var(--suave); margin-top: 0.3rem; text-align: center; line-height: 1.15; }
    .coluna .rotulo small { display: block; font-size: 0.65rem; min-height: 0.8em; }
    /* Muitas colunas: o valor sai da coluna (fica no tooltip e para leitores de tela) e o rótulo encolhe. */
    .colunas.compacto { gap: 0.2rem; }
    .colunas.compacto .rotulo { font-size: 0.58rem; }
    .colunas.compacto .rotulo small { font-size: 0.55rem; }
    /* Nome e valor numa linha, barra embaixo ocupando toda a largura do gráfico. */
    .linha-barra { display: grid; grid-template-columns: 1fr auto; grid-template-areas: "rotulo valor" "trilho trilho"; gap: 0.2rem 0.6rem; font-size: 0.85rem; }
    .linha-barra .rotulo { grid-area: rotulo; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .linha-barra .valor { grid-area: valor; color: var(--suave); white-space: nowrap; font-size: 0.8rem; text-align: right; }
    .linha-barra .trilho { grid-area: trilho; min-width: 0; background: var(--fundo); border-radius: 3px; }
    .linha-barra .barra { height: 0.6rem; background: var(--primaria); border-radius: 3px; }
    /* Só valores acima de zero ganham tamanho mínimo: zero não desenha barra. */
    .coluna .barra.positiva { min-height: 2px; }
    .linha-barra .barra.positiva { min-width: 2px; }
    .carregar-venda { display: flex; gap: 0.5rem; align-items: flex-end; }
    .carregar-venda label { margin-top: 0; }
    .carregar-venda input { width: 7rem; }
    .grade-campos { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 0 1rem; }
    .erro-campo { color: var(--perigo); font-size: 0.8rem; min-height: 1.1em; margin-top: 0.2rem; }
    input[aria-invalid="true"], select[aria-invalid="true"] { border-color: var(--perigo); }
    .acoes { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; margin-top: 1rem; }
    .total { margin-left: auto; color: var(--suave); }
    .sucesso { color: var(--sucesso); font-size: 0.9rem; min-height: 1.2em; margin-top: 0.75rem; }
    .tabela-rolagem { overflow-x: auto; margin-top: 1rem; }
    table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
    th, td { padding: 0.5rem 0.6rem; border-bottom: 1px solid var(--borda); text-align: left; white-space: nowrap; }
    th { color: var(--suave); font-weight: 600; }
    td.numero, th.numero { text-align: right; }
    th.selecao, td.selecao { width: 2rem; }
    th button.ordenar {
      background: none; color: inherit; font: inherit; padding: 0; border-radius: 0;
      display: inline-flex; gap: 0.25rem; align-items: center;
    }
    th button.ordenar:hover { background: none; color: var(--texto); }
    th[aria-sort="ascending"] button.ordenar, th[aria-sort="descending"] button.ordenar { color: var(--texto); }
    .seta { font-size: 0.75rem; min-width: 0.75rem; }
    tbody tr.selecionada { background: #eef3ff; }
    tbody tr:hover { background: #f8f9fb; }
    tbody tr.selecionada:hover { background: #e3ebff; }
    td.vazio { text-align: center; color: var(--suave); padding: 1.5rem; }
    button.pequeno { padding: 0.25rem 0.6rem; font-size: 0.85rem; }
    button.perigo { background: var(--perigo); }
    button.perigo:hover { background: #991b1b; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .paginacao { display: flex; gap: 0.75rem; align-items: center; justify-content: flex-end; margin-top: 1rem; }
    .paginacao span { color: var(--suave); font-size: 0.9rem; }
    #formulario-busca { margin-top: 1rem; padding: 1rem; border: 1px solid var(--borda); border-radius: 6px; background: var(--fundo); }
    #formulario-busca legend { font-weight: 600; padding: 0 0.25rem; }
    #formulario-busca fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
    #formulario-busca label { margin-top: 0.5rem; }
    /* Os 4 filtros cabem numa linha no cartão; em telas estreitas, quebram. */
    #formulario-busca .grade-campos { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
    #formulario-busca .acoes { margin-top: 0.75rem; }
    .filtros-ativos { color: var(--suave); font-size: 0.85rem; }
  </style>
</head>
<body>
  <header>
    <h1>Vendas</h1>
    <div style="display:flex; gap:1rem; align-items:center;">
      <span id="saude" class="situacao"><span class="ponto"></span><span id="texto-saude">verificando API…</span></span>
      <span id="info-usuario" class="oculto"></span>
      <button id="sair" class="secundario oculto" type="button">Sair</button>
    </div>
  </header>

  <main>
    <section id="tela-login" class="oculto">
      <div class="cartao">
        <h2 style="margin-top:0">Entrar</h2>
        <form id="formulario-login" novalidate>
          <label for="usuario">Usuário</label>
          <input id="usuario" name="usuario" autocomplete="username" required>
          <label for="senha">Senha</label>
          <input id="senha" name="senha" type="password" autocomplete="current-password" required>
          <button type="submit">Entrar</button>
          <div id="erro-login" class="erro" role="alert"></div>
        </form>
      </div>
    </section>

    <section id="tela-inicial" class="oculto">
      <div class="cartao">
        <h2 style="margin-top:0">Página inicial</h2>
        <p>Bem-vindo(a), <strong id="nome-boas-vindas"></strong>.</p>
      </div>

      <div class="cartao" id="cartao-dashboard">
        <div class="cabecalho-cartao">
          <h2>Dashboard</h2>
          <div class="acoes-cabecalho alinhadas">
            <span id="atualizado-dashboard" class="situacao" role="status"></span>
            <button type="button" id="atualizar-dashboard" class="secundario">Atualizar</button>
          </div>
        </div>
        <div class="resumo-dashboard">
          <div><span>Vendas registradas (todo o período)</span><strong id="total-vendas-dashboard">—</strong></div>
          <div><span>Faturamento total (todo o período)</span><strong id="faturamento-dashboard">—</strong></div>
        </div>
        <div class="graficos">
          <figure class="grafico">
            <figcaption>Faturamento por mês</figcaption>
            <p class="legenda">Soma do valor total das vendas nos últimos 12 meses; mês sem venda aparece zerado</p>
            <div id="grafico-mes" class="colunas"></div>
          </figure>
          <figure class="grafico">
            <figcaption>Faturamento por categoria</figcaption>
            <p class="legenda">Soma do valor total das vendas de cada categoria</p>
            <div id="grafico-categoria" class="barras"></div>
          </figure>
          <figure class="grafico">
            <figcaption>Top 5 produtos</figcaption>
            <p class="legenda">Produtos com mais unidades vendidas</p>
            <div id="grafico-produtos" class="barras"></div>
          </figure>
        </div>
        <div id="erro-dashboard" class="erro" role="alert"></div>
      </div>

      <div class="cartao" id="cartao-venda">
        <div class="cabecalho-cartao">
          <h2 id="titulo-venda">Nova venda</h2>
          <form id="formulario-carregar" class="carregar-venda" novalidate>
            <div>
              <label for="id-carregar">Editar venda nº</label>
              <input id="id-carregar" type="number" min="1" step="1" inputmode="numeric">
            </div>
            <button type="submit" class="secundario">Carregar</button>
          </form>
        </div>
        <form id="formulario-venda" novalidate>
          <div class="grade-campos">
            <div>
              <label for="produto_id">Produto *</label>
              <select id="produto_id" required aria-describedby="erro-produto_id">
                <option value="">Carregando produtos…</option>
              </select>
              <div id="erro-produto_id" class="erro-campo"></div>
            </div>
            <div>
              <label for="quantidade">Quantidade *</label>
              <input id="quantidade" type="number" min="1" max="10000" step="1" inputmode="numeric" required aria-describedby="erro-quantidade">
              <div id="erro-quantidade" class="erro-campo"></div>
            </div>
            <div>
              <label for="valor_unitario">Valor unitário (R$) *</label>
              <input id="valor_unitario" type="number" min="0.01" max="100000" step="0.01" inputmode="decimal" required aria-describedby="erro-valor_unitario">
              <div id="erro-valor_unitario" class="erro-campo"></div>
            </div>
            <div>
              <label for="data_venda">Data da venda *</label>
              <input id="data_venda" type="date" required aria-describedby="erro-data_venda">
              <div id="erro-data_venda" class="erro-campo"></div>
            </div>
          </div>
          <div class="acoes">
            <button type="submit" id="salvar-venda">Cadastrar venda</button>
            <button type="button" id="cancelar-edicao" class="secundario oculto">Cancelar edição</button>
            <span class="total">Total: <strong id="total-venda">—</strong></span>
          </div>
          <div id="erro-venda" class="erro" role="alert"></div>
          <div id="sucesso-venda" class="sucesso" role="status"></div>
        </form>
      </div>

      <div class="cartao" id="cartao-listagem">
        <div class="cabecalho-cartao">
          <h2>Vendas cadastradas</h2>
          <div class="acoes-cabecalho">
            <button type="button" id="exportar-csv" class="secundario">Exportar CSV</button>
            <button type="button" id="excluir-selecionadas" class="perigo" disabled>Excluir selecionadas</button>
          </div>
        </div>
        <form id="formulario-busca" novalidate>
          <fieldset>
            <legend>Busca avançada</legend>
            <div class="grade-campos">
              <div>
                <label for="filtro-produto_id">Produto</label>
                <select id="filtro-produto_id">
                  <option value="">Todos os produtos</option>
                </select>
              </div>
              <div>
                <label for="filtro-categoria">Categoria</label>
                <select id="filtro-categoria">
                  <option value="">Todas as categorias</option>
                </select>
              </div>
              <div>
                <label for="filtro-data_inicio">Data inicial</label>
                <input id="filtro-data_inicio" type="date" aria-describedby="erro-filtro-data_inicio">
                <div id="erro-filtro-data_inicio" class="erro-campo"></div>
              </div>
              <div>
                <label for="filtro-data_fim">Data final</label>
                <input id="filtro-data_fim" type="date" aria-describedby="erro-filtro-data_fim">
                <div id="erro-filtro-data_fim" class="erro-campo"></div>
              </div>
            </div>
            <div class="acoes">
              <button type="submit" id="buscar">Buscar</button>
              <button type="button" id="limpar-filtros" class="secundario">Limpar filtros</button>
              <span id="filtros-ativos" class="filtros-ativos" role="status"></span>
            </div>
          </fieldset>
        </form>
        <div class="tabela-rolagem">
          <table id="tabela-vendas">
            <thead>
              <tr>
                <th class="selecao"><input type="checkbox" id="selecionar-todas" aria-label="Selecionar todas as vendas da página"></th>
                <th data-coluna="id" class="numero"><button type="button" class="ordenar">Nº <span class="seta"></span></button></th>
                <th data-coluna="data_venda"><button type="button" class="ordenar">Data <span class="seta"></span></button></th>
                <th data-coluna="produto_nome"><button type="button" class="ordenar">Produto <span class="seta"></span></button></th>
                <th data-coluna="categoria"><button type="button" class="ordenar">Categoria <span class="seta"></span></button></th>
                <th data-coluna="quantidade" class="numero"><button type="button" class="ordenar">Qtd. <span class="seta"></span></button></th>
                <th data-coluna="valor_total" class="numero"><button type="button" class="ordenar">Valor total <span class="seta"></span></button></th>
                <th><span class="visualmente-oculto">Ações</span></th>
              </tr>
            </thead>
            <tbody id="corpo-tabela"></tbody>
          </table>
        </div>
        <div class="paginacao">
          <button type="button" id="pagina-anterior" class="secundario pequeno">‹ Anterior</button>
          <span id="info-paginacao">—</span>
          <button type="button" id="proxima-pagina" class="secundario pequeno">Próxima ›</button>
        </div>
        <div id="erro-listagem" class="erro" role="alert"></div>
        <div id="sucesso-listagem" class="sucesso" role="status"></div>
      </div>
    </section>
  </main>

  <script>
    const CHAVE_TOKEN = "token_web";
    const $ = (id) => document.getElementById(id);

    async function verificarSaude() {
      const elemento = $("saude");
      try {
        const resposta = await fetch("/api/web/health");
        const disponivel = resposta.ok;
        elemento.classList.toggle("disponivel", disponivel);
        elemento.classList.toggle("indisponivel", !disponivel);
        $("texto-saude").textContent = disponivel ? "API disponível" : "API indisponível";
      } catch {
        elemento.classList.add("indisponivel");
        $("texto-saude").textContent = "API indisponível";
      }
    }

    const CAMPOS_VENDA = ["produto_id", "quantidade", "valor_unitario", "data_venda"];
    // Manter iguais a QUANTIDADE_MAXIMA e VALOR_UNITARIO_MAXIMO de api.py.
    const QUANTIDADE_MAXIMA = 10000;
    const VALOR_UNITARIO_MAXIMO = 100000;
    const moeda = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" });
    let produtos = [];
    let idEmEdicao = null;
    let formularioAlterado = false;

    class NaoAutenticado extends Error {}

    async function chamarApi(caminho, opcoes = {}) {
      const resposta = await fetch(caminho, {
        ...opcoes,
        headers: {
          "Content-Type": "application/json",
          Authorization: `Bearer ${sessionStorage.getItem(CHAVE_TOKEN)}`,
          ...(opcoes.headers || {}),
        },
      });
      if (resposta.status === 401) {
        mostrarLogin();
        throw new NaoAutenticado();
      }
      const dados = await resposta.json().catch(() => ({}));
      return { resposta, dados };
    }

    function hojeLocal() {
      const agora = new Date();
      agora.setMinutes(agora.getMinutes() - agora.getTimezoneOffset());
      return agora.toISOString().slice(0, 10);
    }

    async function carregarProdutos() {
      const select = $("produto_id");
      try {
        const { resposta, dados } = await chamarApi("/api/web/produtos");
        if (!resposta.ok) throw new Error();
        produtos = dados.produtos;
        agruparProdutos(select, "Selecione o produto", (p) => `${p.nome} — ${moeda.format(p.preco)}`);
        preencherFiltrosDeProduto();
      } catch (erro) {
        if (erro instanceof NaoAutenticado) return;
        const aviso = "Não foi possível carregar os produtos";
        select.replaceChildren(new Option(aviso, ""));
        $("filtro-produto_id").replaceChildren(new Option(aviso, ""));
        $("filtro-categoria").replaceChildren(new Option("Não foi possível carregar as categorias", ""));
      }
    }

    // Preenche `select` com os produtos agrupados por categoria e retorna as categorias em ordem.
    // `rotulo` formata o texto de cada opção. Usado pelo formulário de venda e pelo filtro da busca.
    function agruparProdutos(select, primeira, rotulo) {
      select.replaceChildren(new Option(primeira, ""));
      const grupos = {};
      for (const produto of produtos) {
        if (!grupos[produto.categoria]) {
          grupos[produto.categoria] = document.createElement("optgroup");
          grupos[produto.categoria].label = produto.categoria;
          select.append(grupos[produto.categoria]);
        }
        grupos[produto.categoria].append(new Option(rotulo(produto), produto.id));
      }
      return Object.keys(grupos).sort();
    }

    function limparErrosVenda() {
      for (const campo of CAMPOS_VENDA) {
        $(`erro-${campo}`).textContent = "";
        $(campo).removeAttribute("aria-invalid");
      }
      $("erro-venda").textContent = "";
    }

    function mostrarErrosVenda(erros) {
      for (const [campo, mensagem] of Object.entries(erros)) {
        if (!CAMPOS_VENDA.includes(campo)) continue;
        $(`erro-${campo}`).textContent = mensagem;
        $(campo).setAttribute("aria-invalid", "true");
      }
      const primeiro = CAMPOS_VENDA.find((campo) => erros[campo]);
      if (primeiro) $(primeiro).focus();
    }

    function lerFormularioVenda() {
      const venda = {};
      const erros = {};

      const produtoId = $("produto_id").value;
      if (!produtoId) erros.produto_id = "Informe o produto.";
      else venda.produto_id = Number(produtoId);

      const quantidade = $("quantidade").value;
      if (!quantidade) erros.quantidade = "Informe a quantidade.";
      else if (!/^\d+$/.test(quantidade) || Number(quantidade) < 1 || Number(quantidade) > QUANTIDADE_MAXIMA)
        erros.quantidade = `A quantidade deve ser um número inteiro entre 1 e ${QUANTIDADE_MAXIMA}.`;
      else venda.quantidade = Number(quantidade);

      const valor = $("valor_unitario").value;
      if (!valor) erros.valor_unitario = $("valor_unitario").validity.badInput ? "Valor unitário inválido." : "Informe o valor unitário.";
      else if (!/^\d+(\.\d{1,2})?$/.test(valor) || Number(valor) <= 0 || Number(valor) > VALOR_UNITARIO_MAXIMO)
        erros.valor_unitario = "O valor unitário deve ser maior que zero, até 100000.00, com no máximo 2 casas decimais.";
      else venda.valor_unitario = valor;

      const data = $("data_venda").value;
      if (!data) erros.data_venda = "Informe a data da venda.";
      else if (data > hojeLocal()) erros.data_venda = "A data da venda não pode ser futura.";
      else venda.data_venda = data;

      return { venda, erros };
    }

    function atualizarTotal() {
      const quantidade = Number($("quantidade").value);
      const valor = Number($("valor_unitario").value);
      $("total-venda").textContent = quantidade > 0 && valor > 0 ? moeda.format(quantidade * valor) : "—";
    }

    function prepararNovaVenda() {
      idEmEdicao = null;
      $("formulario-venda").reset();
      $("data_venda").value = hojeLocal();
      $("data_venda").max = hojeLocal();
      $("titulo-venda").textContent = "Nova venda";
      $("salvar-venda").textContent = "Cadastrar venda";
      $("cancelar-edicao").classList.add("oculto");
      limparErrosVenda();
      atualizarTotal();
      formularioAlterado = false;
    }

    function prepararEdicao(venda) {
      idEmEdicao = venda.id;
      $("produto_id").value = String(venda.produto_id);
      $("quantidade").value = venda.quantidade;
      $("valor_unitario").value = venda.valor_unitario;
      $("data_venda").value = venda.data_venda;
      $("titulo-venda").textContent = `Editar venda nº ${venda.id}`;
      $("salvar-venda").textContent = "Salvar alterações";
      $("cancelar-edicao").classList.remove("oculto");
      limparErrosVenda();
      atualizarTotal();
      formularioAlterado = false;
    }

    // Preencher campos por código não dispara estes eventos; só o que o usuário digita ou escolhe conta.
    $("formulario-venda").addEventListener("input", () => (formularioAlterado = true));
    $("formulario-venda").addEventListener("change", () => (formularioAlterado = true));

    $("produto_id").addEventListener("change", () => {
      const produto = produtos.find((p) => String(p.id) === $("produto_id").value);
      if (produto && idEmEdicao === null) $("valor_unitario").value = produto.preco;
      atualizarTotal();
    });
    $("quantidade").addEventListener("input", atualizarTotal);
    $("valor_unitario").addEventListener("input", atualizarTotal);

    $("cancelar-edicao").addEventListener("click", () => {
      prepararNovaVenda();
      $("sucesso-venda").textContent = "";
    });

    async function carregarVendaParaEdicao(id) {
      if (formularioAlterado && !confirm("Há alterações não salvas no formulário. Descartar e carregar outra venda?")) {
        return false;
      }
      $("sucesso-venda").textContent = "";
      limparErrosVenda();
      try {
        const { resposta, dados } = await chamarApi(`/api/web/records/${id}`);
        if (!resposta.ok) {
          $("erro-venda").textContent = dados.erro || "Não foi possível carregar a venda.";
          return false;
        }
        prepararEdicao(dados);
        return true;
      } catch (erro) {
        if (!(erro instanceof NaoAutenticado)) $("erro-venda").textContent = "Não foi possível conectar à API.";
        return false;
      }
    }

    $("formulario-carregar").addEventListener("submit", async (evento) => {
      evento.preventDefault();
      const id = $("id-carregar").value;
      if (!/^\d+$/.test(id) || Number(id) < 1) {
        $("sucesso-venda").textContent = "";
        limparErrosVenda();
        $("erro-venda").textContent = "Informe o número da venda a editar.";
        return;
      }
      if (await carregarVendaParaEdicao(id)) $("id-carregar").value = "";
    });

    $("formulario-venda").addEventListener("submit", async (evento) => {
      evento.preventDefault();
      limparErrosVenda();
      $("sucesso-venda").textContent = "";
      const { venda, erros } = lerFormularioVenda();
      if (Object.keys(erros).length) {
        mostrarErrosVenda(erros);
        return;
      }
      const editando = idEmEdicao !== null;
      const botao = $("salvar-venda");
      botao.disabled = true;
      try {
        const { resposta, dados } = await chamarApi(editando ? `/api/web/records/${idEmEdicao}` : "/api/web/records", {
          method: editando ? "PUT" : "POST",
          body: JSON.stringify(venda),
        });
        if (!resposta.ok) {
          $("erro-venda").textContent = dados.erro || "Não foi possível salvar a venda.";
          if (dados.campos) mostrarErrosVenda(dados.campos);
          return;
        }
        const resumo = `${dados.quantidade} × ${dados.produto_nome}, total ${moeda.format(dados.valor_total)}`;
        if (editando) {
          prepararEdicao(dados);
          $("sucesso-venda").textContent = `Venda nº ${dados.id} atualizada: ${resumo}.`;
        } else {
          prepararNovaVenda();
          $("sucesso-venda").textContent = `Venda nº ${dados.id} cadastrada: ${resumo}.`;
        }
        recarregarDados();
      } catch (erro) {
        if (!(erro instanceof NaoAutenticado)) $("erro-venda").textContent = "Não foi possível conectar à API.";
      } finally {
        botao.disabled = false;
      }
    });

    // --- Listagem, ordenação e exclusão (#3) ---------------------------------------------------------

    // Estado já exibido na tela. Só muda depois de uma resposta OK da API.
    // `filtros` são os da busca avançada (#4) aplicados à tabela; vazio = listagem completa.
    let listagem = { pagina: 1, totalPaginas: 1, ordenar: "data_venda", direcao: "desc", filtros: {} };
    let ultimaRequisicaoListagem = 0;
    // Seleção vale só para a página exibida: é limpa ao trocar de página ou de ordenação.
    const selecionadas = new Set();
    // Enquanto a exclusão roda, a seleção fica travada e o botão desabilitado (evita um segundo laço).
    let excluindo = false;
    const ROTULOS_DIRECAO = { asc: "ascending", desc: "descending" };

    function formatarData(iso) {
      const [ano, mes, dia] = iso.split("-");
      return `${dia}/${mes}/${ano}`;
    }

    function celula(texto, classe) {
      const td = document.createElement("td");
      td.textContent = texto;
      if (classe) td.className = classe;
      return td;
    }

    function atualizarCabecalhos() {
      for (const th of document.querySelectorAll("#tabela-vendas th[data-coluna]")) {
        const ativa = th.dataset.coluna === listagem.ordenar;
        if (ativa) th.setAttribute("aria-sort", ROTULOS_DIRECAO[listagem.direcao]);
        else th.removeAttribute("aria-sort");
        th.querySelector(".seta").textContent = ativa ? (listagem.direcao === "asc" ? "▲" : "▼") : "";
      }
    }

    // Atualiza a seleção e os controles que mudam a visão da tabela (busca, paginação, ordenação),
    // que ficam desabilitados durante a exclusão para ela terminar sobre a mesma visão.
    function atualizarSelecao() {
      const caixas = [...document.querySelectorAll("#corpo-tabela input[type=checkbox]")];
      for (const caixa of caixas) {
        caixa.closest("tr").classList.toggle("selecionada", caixa.checked);
        caixa.disabled = excluindo;
      }
      $("selecionar-todas").disabled = excluindo;
      const marcadas = caixas.filter((caixa) => caixa.checked).length;
      $("selecionar-todas").checked = caixas.length > 0 && marcadas === caixas.length;
      $("selecionar-todas").indeterminate = marcadas > 0 && marcadas < caixas.length;
      const botao = $("excluir-selecionadas");
      botao.disabled = excluindo || selecionadas.size === 0;
      botao.textContent = selecionadas.size ? `Excluir selecionadas (${selecionadas.size})` : "Excluir selecionadas";
      $("buscar").disabled = excluindo;
      $("limpar-filtros").disabled = excluindo;
      $("pagina-anterior").disabled = excluindo || listagem.pagina <= 1;
      $("proxima-pagina").disabled = excluindo || listagem.pagina >= listagem.totalPaginas;
      for (const ordenar of document.querySelectorAll("#tabela-vendas th[data-coluna] button")) ordenar.disabled = excluindo;
    }

    function desenharTabela(vendas) {
      const corpo = $("corpo-tabela");
      corpo.replaceChildren();
      if (!vendas.length) {
        const linha = document.createElement("tr");
        const vazio = celula(
          Object.keys(listagem.filtros).length ? "Nenhuma venda encontrada com esses filtros." : "Nenhuma venda cadastrada.",
          "vazio",
        );
        vazio.colSpan = 8;
        linha.append(vazio);
        corpo.append(linha);
        return;
      }
      for (const venda of vendas) {
        const linha = document.createElement("tr");
        const caixa = document.createElement("input");
        caixa.type = "checkbox";
        caixa.checked = selecionadas.has(venda.id);
        caixa.setAttribute("aria-label", `Selecionar venda nº ${venda.id}`);
        caixa.addEventListener("change", () => {
          if (caixa.checked) selecionadas.add(venda.id);
          else selecionadas.delete(venda.id);
          atualizarSelecao();
        });
        const tdCaixa = celula("", "selecao");
        tdCaixa.append(caixa);

        const editar = document.createElement("button");
        editar.type = "button";
        editar.className = "secundario pequeno";
        editar.textContent = "Editar";
        editar.addEventListener("click", async () => {
          if (await carregarVendaParaEdicao(venda.id)) $("cartao-venda").scrollIntoView({ behavior: "smooth" });
        });
        const tdAcoes = celula("");
        tdAcoes.append(editar);

        linha.append(
          tdCaixa,
          celula(venda.id, "numero"),
          celula(formatarData(venda.data_venda)),
          celula(venda.produto_nome),
          celula(venda.categoria),
          celula(venda.quantidade, "numero"),
          celula(moeda.format(venda.valor_total), "numero"),
          tdAcoes,
        );
        corpo.append(linha);
      }
    }

    // Carrega a listagem com as mudanças pedidas (ex.: { pagina: 2 }). Sem argumento, recarrega a atual.
    async function carregarListagem(mudancas = {}) {
      const alvo = { ...listagem, ...mudancas };
      const numero = ++ultimaRequisicaoListagem;
      $("erro-listagem").textContent = "";
      const parametros = new URLSearchParams({ ...alvo.filtros, pagina: alvo.pagina, ordenar: alvo.ordenar, direcao: alvo.direcao });
      // Com filtros, usa a rota da busca avançada (#4); sem filtros, a listagem completa (#3).
      const rota = Object.keys(alvo.filtros).length ? "/api/web/records/search" : "/api/web/records";
      try {
        const { resposta, dados } = await chamarApi(`${rota}?${parametros}`);
        // Outra requisição começou depois desta: a resposta está desatualizada e é descartada.
        if (numero !== ultimaRequisicaoListagem) return;
        if (!resposta.ok) {
          // No 400, `campos` explica cada parâmetro recusado (ex.: período invertido na busca).
          $("erro-listagem").textContent = dados.campos
            ? Object.values(dados.campos).join(" ")
            : dados.erro || "Não foi possível carregar as vendas.";
          // A tabela continua com os filtros anteriores: o formulário volta a mostrá-los, junto do #filtros-ativos.
          if (mudancas.filtros) preencherFormularioBusca(listagem.filtros);
          return;
        }
        if (dados.pagina > dados.total_paginas) {
          // A página ficou vazia (ex.: depois de excluir os últimos itens): vai para a última existente.
          return carregarListagem({ ...mudancas, pagina: dados.total_paginas });
        }
        const mudouVisao =
          alvo.pagina !== listagem.pagina ||
          alvo.ordenar !== listagem.ordenar ||
          alvo.direcao !== listagem.direcao ||
          JSON.stringify(alvo.filtros) !== JSON.stringify(listagem.filtros);
        if (mudouVisao) selecionadas.clear();
        listagem = { ...alvo, totalPaginas: dados.total_paginas };
        desenharTabela(dados.vendas);
        atualizarCabecalhos();
        const filtrada = Object.keys(listagem.filtros).length > 0;
        const contagem = `${dados.total} ${dados.total === 1 ? "venda" : "vendas"}${filtrada ? (dados.total === 1 ? " encontrada" : " encontradas") : ""}`;
        $("info-paginacao").textContent = `Página ${dados.pagina} de ${dados.total_paginas} · ${contagem}`;
        $("filtros-ativos").textContent = filtrada ? `Filtros aplicados: ${descreverFiltros(listagem.filtros)}.` : "";
      } catch (erro) {
        if (numero === ultimaRequisicaoListagem && !(erro instanceof NaoAutenticado))
          $("erro-listagem").textContent = "Não foi possível conectar à API.";
      } finally {
        if (numero === ultimaRequisicaoListagem) atualizarSelecao();
      }
    }

    for (const th of document.querySelectorAll("#tabela-vendas th[data-coluna]")) {
      th.querySelector("button").addEventListener("click", () => {
        if (excluindo) return;
        const ordenar = th.dataset.coluna;
        let direcao;
        if (listagem.ordenar === ordenar) direcao = listagem.direcao === "asc" ? "desc" : "asc";
        else direcao = ordenar === "produto_nome" || ordenar === "categoria" ? "asc" : "desc";
        carregarListagem({ ordenar, direcao, pagina: 1 });
      });
    }

    // --- Busca avançada com filtros combináveis (#4) -------------------------------------------------

    // Manter igual a CAMPOS_BUSCA_WEB de db.py.
    const CAMPOS_FILTRO = ["produto_id", "categoria", "data_inicio", "data_fim"];

    function preencherFormularioBusca(filtros) {
      for (const campo of CAMPOS_FILTRO) $(`filtro-${campo}`).value = filtros[campo] ?? "";
    }

    function preencherFiltrosDeProduto() {
      const selectProduto = $("filtro-produto_id");
      const selectCategoria = $("filtro-categoria");
      const produtoEscolhido = selectProduto.value;
      const categoriaEscolhida = selectCategoria.value;
      const categorias = agruparProdutos(selectProduto, "Todos os produtos", (p) => p.nome);
      selectCategoria.replaceChildren(new Option("Todas as categorias", ""));
      for (const categoria of categorias) selectCategoria.append(new Option(categoria, categoria));
      selectProduto.value = produtoEscolhido;
      selectCategoria.value = categoriaEscolhida;
    }

    function descreverFiltros(filtros) {
      const partes = [];
      if (filtros.produto_id) {
        const produto = produtos.find((p) => String(p.id) === filtros.produto_id);
        partes.push(`produto ${produto ? produto.nome : `nº ${filtros.produto_id}`}`);
      }
      if (filtros.categoria) partes.push(`categoria ${filtros.categoria}`);
      if (filtros.data_inicio && filtros.data_fim)
        partes.push(`de ${formatarData(filtros.data_inicio)} a ${formatarData(filtros.data_fim)}`);
      else if (filtros.data_inicio) partes.push(`a partir de ${formatarData(filtros.data_inicio)}`);
      else if (filtros.data_fim) partes.push(`até ${formatarData(filtros.data_fim)}`);
      return partes.join(", ");
    }

    function limparErrosBusca() {
      for (const campo of ["data_inicio", "data_fim"]) {
        $(`erro-filtro-${campo}`).textContent = "";
        $(`filtro-${campo}`).removeAttribute("aria-invalid");
      }
    }

    function mostrarErroBusca(campo, mensagem) {
      $(`erro-filtro-${campo}`).textContent = mensagem;
      $(`filtro-${campo}`).setAttribute("aria-invalid", "true");
    }

    // Lê os filtros preenchidos. Retorna null (e mostra o erro) se o período for inválido.
    function lerFiltros() {
      limparErrosBusca();
      const filtros = {};
      for (const campo of CAMPOS_FILTRO) {
        const elemento = $(`filtro-${campo}`);
        if (elemento.value) filtros[campo] = elemento.value;
        else if (elemento.validity.badInput) {
          mostrarErroBusca(campo, "Data inválida.");
          return null;
        }
      }
      if (filtros.data_inicio && filtros.data_fim && filtros.data_inicio > filtros.data_fim) {
        mostrarErroBusca("data_fim", "A data final não pode ser anterior à data inicial.");
        $("filtro-data_fim").focus();
        return null;
      }
      return filtros;
    }

    $("formulario-busca").addEventListener("submit", async (evento) => {
      evento.preventDefault();
      if (excluindo) return;
      const filtros = lerFiltros();
      if (!filtros) return;
      $("sucesso-listagem").textContent = "";
      await carregarListagem({ filtros, pagina: 1 });
    });

    $("limpar-filtros").addEventListener("click", () => {
      if (excluindo) return;
      $("formulario-busca").reset();
      limparErrosBusca();
      $("sucesso-listagem").textContent = "";
      carregarListagem({ filtros: {}, pagina: 1 });
    });

    $("selecionar-todas").addEventListener("change", (evento) => {
      const marcar = evento.target.checked;
      for (const caixa of document.querySelectorAll("#corpo-tabela input[type=checkbox]")) {
        caixa.checked = marcar;
        caixa.dispatchEvent(new Event("change"));
      }
    });

    $("pagina-anterior").addEventListener("click", () => {
      if (!excluindo && listagem.pagina > 1) carregarListagem({ pagina: listagem.pagina - 1 });
    });

    $("proxima-pagina").addEventListener("click", () => {
      if (!excluindo && listagem.pagina < listagem.totalPaginas) carregarListagem({ pagina: listagem.pagina + 1 });
    });

    // --- Exportação CSV (#5) -------------------------------------------------------------------------

    // Exporta todas as vendas dos filtros aplicados (não só a página atual), na ordenação da tabela.
    // Usa os filtros de `listagem`, e não os do formulário: o CSV corresponde ao que a tabela mostra.
    $("exportar-csv").addEventListener("click", async () => {
      const botao = $("exportar-csv");
      if (botao.disabled) return;
      botao.disabled = true;
      $("erro-listagem").textContent = "";
      $("sucesso-listagem").textContent = "";
      const parametros = new URLSearchParams({ ...listagem.filtros, ordenar: listagem.ordenar, direcao: listagem.direcao });
      try {
        // fetch direto (e não chamarApi): a resposta é um arquivo, não JSON.
        const resposta = await fetch(`/api/web/records/export?${parametros}`, {
          headers: { Authorization: `Bearer ${sessionStorage.getItem(CHAVE_TOKEN)}` },
        });
        if (resposta.status === 401) {
          mostrarLogin();
          return;
        }
        if (!resposta.ok) {
          const dados = await resposta.json().catch(() => ({}));
          $("erro-listagem").textContent = dados.campos
            ? Object.values(dados.campos).join(" ")
            : dados.erro || "Não foi possível exportar as vendas.";
          return;
        }
        const disposicao = resposta.headers.get("Content-Disposition") || "";
        const nome = /filename="([^"]+)"/.exec(disposicao)?.[1] || "vendas.csv";
        const endereco = URL.createObjectURL(await resposta.blob());
        const link = document.createElement("a");
        link.href = endereco;
        link.download = nome;
        document.body.append(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(endereco), 1000);
        $("sucesso-listagem").textContent = `Arquivo ${nome} gerado.`;
      } catch (erro) {
        $("erro-listagem").textContent = "Não foi possível conectar à API.";
      } finally {
        botao.disabled = false;
      }
    });

    async function excluirVenda(id) {
      const { resposta, dados } = await chamarApi(`/api/web/records/${id}`, { method: "DELETE" });
      // 404: outra sessão já excluiu; para quem está na tela, o resultado é o mesmo.
      if (!resposta.ok && resposta.status !== 404) throw new Error(dados.erro || "erro");
    }

    $("excluir-selecionadas").addEventListener("click", async () => {
      if (excluindo) return;
      const ids = [...selecionadas].sort((a, b) => a - b);
      if (!ids.length) return;
      const descricao = ids.length === 1 ? `a venda nº ${ids[0]}` : `${ids.length} vendas (nº ${ids.join(", ")})`;
      if (!confirm(`Excluir ${descricao}? Esta ação não pode ser desfeita.`)) return;

      $("erro-listagem").textContent = "";
      $("sucesso-listagem").textContent = "";
      excluindo = true;
      atualizarSelecao();
      try {
        // Todas em paralelo: uma falha não impede as outras, e cada id tem o seu resultado.
        const resultados = await Promise.allSettled(ids.map(excluirVenda));
        if (resultados.some((r) => r.status === "rejected" && r.reason instanceof NaoAutenticado)) return;

        const excluidas = ids.filter((_, i) => resultados[i].status === "fulfilled");
        const falhas = ids
          .map((id, i) => [id, resultados[i]])
          .filter(([, r]) => r.status === "rejected")
          .map(([id, r]) => `nº ${id} (${r.reason instanceof TypeError ? "sem conexão com a API" : r.reason.message})`);
        for (const id of excluidas) selecionadas.delete(id);
        if (excluidas.includes(idEmEdicao)) prepararNovaVenda();
        await (excluidas.length ? recarregarDados() : carregarListagem());
        // Mensagens depois da recarga, que limpa a área de erro; um erro da própria recarga é mantido.
        if (excluidas.length)
          $("sucesso-listagem").textContent =
            excluidas.length === 1 ? `Venda nº ${excluidas[0]} excluída.` : `${excluidas.length} vendas excluídas.`;
        if (falhas.length) {
          const erroRecarga = $("erro-listagem").textContent;
          $("erro-listagem").textContent = [`Não foi possível excluir: ${falhas.join("; ")}.`, erroRecarga]
            .filter(Boolean)
            .join(" ");
        }
      } finally {
        // As que falharam continuam selecionadas, e o botão volta a funcionar mesmo se a recarga falhar.
        excluindo = false;
        atualizarSelecao();
      }
    });

    // --- Dashboard com 3 gráficos (#6) ---------------------------------------------------------------

    const MESES_ABREVIADOS = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
    // Acima disso as colunas ficam estreitas demais para mostrar o valor em cima de cada uma.
    const MAXIMO_COLUNAS_COM_VALOR = 6;
    let ultimaRequisicaoDashboard = 0;

    // "2026-10" -> { mes: "out", ano: "2026" }
    function partesMes(anoMes) {
      const [ano, mes] = anoMes.split("-");
      return { mes: MESES_ABREVIADOS[Number(mes) - 1], ano };
    }

    // Proporção da barra em relação ao maior valor do gráfico (0 a 100%).
    function proporcao(valor, maximo) {
      return maximo > 0 ? `${(valor / maximo) * 100}%` : "0%";
    }

    function elemento(tag, classe, texto) {
      const el = document.createElement(tag);
      if (classe) el.className = classe;
      if (texto !== undefined) el.textContent = texto;
      return el;
    }

    function barraProporcional(valor, maximo, propriedade) {
      const barra = elemento("div", valor > 0 ? "barra positiva" : "barra");
      barra.style[propriedade] = proporcao(valor, maximo);
      return barra;
    }

    function mensagemVazia(conteiner, texto) {
      conteiner.classList.remove("compacto");
      conteiner.replaceChildren(elemento("div", "vazio", texto));
    }

    // Colunas verticais. `itens` = [{ mes, ano, valor (número), texto (valor por extenso), textoCurto }].
    function desenharColunas(conteiner, itens, textoVazio) {
      if (!itens.some((item) => item.valor > 0)) return mensagemVazia(conteiner, textoVazio);
      const maximo = Math.max(...itens.map((item) => item.valor));
      const compacto = itens.length > MAXIMO_COLUNAS_COM_VALOR;
      conteiner.classList.toggle("compacto", compacto);
      conteiner.replaceChildren(
        ...itens.map((item, indice) => {
          const coluna = elemento("div", "coluna");
          coluna.title = `${item.mes}/${item.ano}: ${item.texto}`;
          // No modo compacto o valor continua no DOM, escondido só visualmente.
          const valor = elemento("span", compacto ? "valor visualmente-oculto" : "valor", compacto ? item.texto : item.textoCurto);
          // O ano aparece na primeira coluna e quando ele muda (janeiro), como em gráficos de calendário.
          const mostrarAno = indice === 0 || item.mes === MESES_ABREVIADOS[0];
          const rotulo = elemento("span", "rotulo", item.mes);
          const ano = compacto ? `’${item.ano.slice(2)}` : item.ano;
          rotulo.append(elemento("small", null, mostrarAno ? ano : ""));
          const area = elemento("div", "area-barra");
          area.append(barraProporcional(item.valor, maximo, "height"));
          coluna.append(valor, area, rotulo);
          return coluna;
        }),
      );
    }

    // Barras horizontais. `itens` = [{ rotulo, valor (número), texto (valor formatado) }].
    function desenharBarras(conteiner, itens, textoVazio) {
      if (!itens.length) return mensagemVazia(conteiner, textoVazio);
      const maximo = Math.max(...itens.map((item) => item.valor));
      conteiner.replaceChildren(
        ...itens.map((item) => {
          const linha = elemento("div", "linha-barra");
          const rotulo = elemento("span", "rotulo", item.rotulo);
          rotulo.title = item.rotulo;
          const trilho = elemento("div", "trilho");
          trilho.append(barraProporcional(item.valor, maximo, "width"));
          linha.append(rotulo, elemento("span", "valor", item.texto), trilho);
          return linha;
        }),
      );
    }

    const moedaCurta = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL", notation: "compact" });

    function desenharDashboard(dados) {
      $("total-vendas-dashboard").textContent = dados.resumo.total_vendas.toLocaleString("pt-BR");
      $("faturamento-dashboard").textContent = moeda.format(dados.resumo.faturamento_total);
      desenharColunas(
        $("grafico-mes"),
        dados.faturamento_por_mes.map((item) => ({
          ...partesMes(item.mes),
          valor: Number(item.total),
          texto: moeda.format(item.total),
          textoCurto: moedaCurta.format(item.total),
        })),
        "Sem vendas nos últimos 12 meses.",
      );
      desenharBarras(
        $("grafico-categoria"),
        dados.faturamento_por_categoria.map((item) => ({
          rotulo: item.categoria,
          valor: Number(item.total),
          texto: moeda.format(item.total),
        })),
        "Nenhuma categoria cadastrada.",
      );
      desenharBarras(
        $("grafico-produtos"),
        dados.top_produtos.map((item) => ({
          rotulo: item.produto_nome,
          valor: item.quantidade,
          texto: `${item.quantidade.toLocaleString("pt-BR")} ${item.quantidade === 1 ? "unidade" : "unidades"}`,
        })),
        "Sem vendas registradas.",
      );
    }

    // Tira da tela os números da carga anterior, para nunca parecerem atuais ao lado de um erro
    // (e para não aparecerem para outra pessoa depois de sair e entrar de novo).
    function limparDashboard() {
      $("total-vendas-dashboard").textContent = "—";
      $("faturamento-dashboard").textContent = "—";
      $("atualizado-dashboard").textContent = "";
      for (const id of ["grafico-mes", "grafico-categoria", "grafico-produtos"]) {
        $(id).classList.remove("compacto");
        $(id).replaceChildren();
      }
    }

    // Recarrega os indicadores do banco. Chamado ao abrir a página, no botão Atualizar e depois de
    // cadastrar, editar ou excluir vendas. Respostas antigas são descartadas, como na listagem.
    async function carregarDashboard() {
      const numero = ++ultimaRequisicaoDashboard;
      $("erro-dashboard").textContent = "";
      $("atualizar-dashboard").disabled = true;
      let resposta, dados;
      try {
        ({ resposta, dados } = await chamarApi("/api/web/dashboard"));
      } catch (erro) {
        if (numero === ultimaRequisicaoDashboard) {
          $("atualizar-dashboard").disabled = false;
          if (!(erro instanceof NaoAutenticado)) {
            limparDashboard();
            $("erro-dashboard").textContent = "Não foi possível conectar à API.";
          }
        }
        return;
      }
      if (numero !== ultimaRequisicaoDashboard) return;
      $("atualizar-dashboard").disabled = false;
      if (!resposta.ok) {
        limparDashboard();
        $("erro-dashboard").textContent = dados.erro || "Não foi possível carregar os indicadores.";
        return;
      }
      // Erro ao desenhar é problema da tela, não da conexão: mensagem própria.
      try {
        desenharDashboard(dados);
        $("atualizado-dashboard").textContent = `Atualizado às ${new Date().toLocaleTimeString("pt-BR")}`;
      } catch (erro) {
        limparDashboard();
        $("erro-dashboard").textContent = "Não foi possível exibir os indicadores recebidos.";
        console.error("Falha ao desenhar o dashboard", erro);
      }
    }

    $("atualizar-dashboard").addEventListener("click", carregarDashboard);

    // Depois de qualquer alteração de vendas: a tabela e o dashboard precisam refletir o banco.
    function recarregarDados() {
      carregarDashboard();
      return carregarListagem();
    }

    function mostrarLogin() {
      limparDashboard();
      sessionStorage.removeItem(CHAVE_TOKEN);
      $("tela-inicial").classList.add("oculto");
      $("info-usuario").classList.add("oculto");
      $("sair").classList.add("oculto");
      $("tela-login").classList.remove("oculto");
      $("usuario").focus();
    }

    function mostrarInicio(nome) {
      $("tela-login").classList.add("oculto");
      $("tela-inicial").classList.remove("oculto");
      $("nome-boas-vindas").textContent = nome;
      $("info-usuario").textContent = nome;
      $("info-usuario").classList.remove("oculto");
      $("sair").classList.remove("oculto");
      prepararNovaVenda();
      $("sucesso-venda").textContent = "";
      carregarProdutos();
      selecionadas.clear();
      $("sucesso-listagem").textContent = "";
      $("formulario-busca").reset();
      limparErrosBusca();
      carregarListagem({ pagina: 1, filtros: {} });
      carregarDashboard();
    }

    async function restaurarSessao() {
      const token = sessionStorage.getItem(CHAVE_TOKEN);
      if (!token) return mostrarLogin();
      try {
        const resposta = await fetch("/api/web/sessao", { headers: { Authorization: `Bearer ${token}` } });
        if (!resposta.ok) return mostrarLogin();
        const dados = await resposta.json();
        mostrarInicio(dados.nome);
      } catch {
        mostrarLogin();
      }
    }

    $("formulario-login").addEventListener("submit", async (evento) => {
      evento.preventDefault();
      const usuario = $("usuario").value.trim();
      const senha = $("senha").value;
      const elementoErro = $("erro-login");
      elementoErro.textContent = "";
      if (!usuario || !senha) {
        elementoErro.textContent = "Informe usuário e senha.";
        return;
      }
      try {
        const resposta = await fetch("/api/web/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ usuario, senha }),
        });
        const dados = await resposta.json().catch(() => ({}));
        if (!resposta.ok) {
          elementoErro.textContent = dados.erro || "Falha no login.";
          return;
        }
        sessionStorage.setItem(CHAVE_TOKEN, dados.token);
        $("senha").value = "";
        mostrarInicio(dados.nome);
      } catch {
        elementoErro.textContent = "Não foi possível conectar à API.";
      }
    });

    $("sair").addEventListener("click", mostrarLogin);

    verificarSaude();
    restaurarSessao();
  </script>
</body>
</html>
